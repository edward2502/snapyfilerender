services:
  backend:
    build: ./backend
    container_name: docket-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - converter_tmp:/tmp/converter_jobs

  frontend:
    image: nginx:alpine
    container_name: docket-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  converter_tmp:
