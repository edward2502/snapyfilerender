name: Keep Render Backend Awake

# Runs every 14 minutes - just under Render's ~15 minute inactivity
# spin-down window, so the backend never has a chance to go to sleep.
on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch: # lets you also trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -s -o /dev/null -w "Health check responded: %{http_code}\n" \
            https://snapyfilerender.onrender.com/api/health
